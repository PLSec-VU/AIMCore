name:                aimcore
version:             0.1.0.0
github:              "githubuser/aimcore"
license:             BSD-3-Clause
author:              "Author name here"
maintainer:          "example@example.com"
copyright:           "2024 Author name here"

extra-source-files:
- README.md
- CHANGELOG.md

# Metadata used when publishing your package
# synopsis:            Short description of your package
# category:            Web

# To avoid duplicated efforts in documentation and dealing with the
# complications of embedding Haddock markup inside cabal files, it is
# common to point users to the README.md file.
description:         Please see the README on GitHub at <https://github.com/githubuser/aimcore#readme>

# The modules listed under the smt-proof flag in the library discharge their
# properties through an SMT solver while GHC compiles them, so building them
# needs a solver on PATH and takes as long as the solver does. Pantomime goes through SBV, and SBV's Z3 backend is
# pointed at a different binary with SBV_Z3; Z3 itself does not finish these in
# useful time, while bitwuzla discharges each in under a minute:
#
#   SBV_Z3=/usr/local/bin/bitwuzla SBV_Z3_OPTIONS="--produce-models" stack test
#
# CI does exactly this: it installs bitwuzla and sets SBV_Z3 to it (see
# .github/workflows/stack-test.yml).
#
# Do not add --fast: at -O0 GHC creates no unfoldings and the plugin fails with
# "Unbound variable in symbolise" rather than reporting a failed proof.
#
# Turn the flag off for a quicker local build and test without a solver:
#
#   stack test --flag aimcore:-smt-proof
flags:
  smt-proof:
    description: Discharge the symbolic proof obligations at compile time.
    manual: true
    default: true

default-extensions:
- BinaryLiterals
- DataKinds
- ExplicitNamespaces
- FlexibleContexts
- FlexibleInstances
- LambdaCase
- NumericUnderscores
- OverloadedStrings
- ScopedTypeVariables
- TemplateHaskell
- TypeApplications
- TypeOperators
- DeriveAnyClass
- DeriveGeneric
- MultiParamTypeClasses
- AllowAmbiguousTypes
- PackageImports
- RecordWildCards
- GeneralizedNewtypeDeriving
- DerivingStrategies

dependencies:
- base >= 4.7 && < 5
- clash-prelude >= 1.8.1
- composition
- mtl >= 2.2.2
- transformers
- pretty
- tasty
- tasty-hunit
- tasty-quickcheck
- containers
- ghc-typelits-natnormalise
- array
- melf
- bytestring
- exceptions
- entropy
- binary
- pantomime
- pantomime-clash
- pantomime-base
- template-haskell

ghc-options:
- -Wall
- -Wcompat
- -Widentities
- -Wincomplete-record-updates
- -Wincomplete-uni-patterns
- -Wmissing-export-lists
- -Wmissing-home-modules
- -Wpartial-fields
- -Wredundant-constraints
- -fexpose-all-unfoldings
- -fplugin GHC.TypeLits.Normalise
- -fplugin Pantomime

library:
  source-dirs:
    - src
    - proof
  when:
    - condition: flag(smt-proof)
      exposed-modules:
        - Proof.Memory.Cache4K.Server.Functional.Solver
        - Proof.Memory.Cache4K.Server.Leakage.Solver
        - Proof.Memory.Cache4K.CachedCore.Functional.Solver
        - Proof.Memory.Cache4K.CachedCore.Leakage.Solver
        - Proof.Core.Functional.Solver
        - Proof.Core.Leakage.Solver
        - Proof.SMT.Axioms
        - Proof.Core.SMT.Array
        - Proof.Core.SMT.Axioms
        - Proof.Memory.Cache4K.SMT.Array
        - Proof.Memory.Cache4K.SMT.Axioms
        - Proof.Memory.Cache4K.SMT.Coherent
        - Proof.SMT.Logged
        - Proof.SMT.Sanity
        - Proof.Core.Functional.System
      cpp-options: -DSMT_PROOF
  # Listed explicitly, with no automatic discovery: the solver modules above
  # live in proof/ too, and must only be built with the smt-proof flag.
  other-modules: []
  exposed-modules:
    - Proof.Memory.Cache4K.Server.Functional.Contract
    - Proof.Memory.Cache4K.Server.Functional.Driver
    - Proof.Memory.Cache4K.Server.Functional.Invariant
    - Proof.Memory.Cache4K.Server.Functional.Obligation
    - Proof.Memory.Cache4K.Server.Leakage.Driver
    - Proof.Memory.Cache4K.Server.Leakage.Invariant
    - Proof.Memory.Cache4K.Server.Leakage.Model
    - Proof.Memory.Cache4K.Server.Leakage.Obligation
    - Proof.Memory.Cache4K.Server.Leakage.Simulator
    - Proof.Memory.Cache4K.CachedCore.Functional.Driver
    - Proof.Memory.Cache4K.CachedCore.Functional.Invariant
    - Proof.Memory.Cache4K.CachedCore.Functional.Machine
    - Proof.Memory.Cache4K.CachedCore.Functional.Obligation
    - Proof.Memory.Cache4K.CachedCore.Leakage.Driver
    - Proof.Memory.Cache4K.CachedCore.Leakage.Invariant
    - Proof.Memory.Cache4K.CachedCore.Leakage.Obligation
    - Proof.Memory.Cache4K.CachedCore.Leakage.Simulator
    - Proof.Memory.Cache4K.SMT.Raw
    - Proof.SMT.Array
    - Proof.Core.Functional.Machine
    - Proof.Core.Functional.Driver
    - Proof.Core.Functional.Invariant
    - Proof.Core.Functional.Obligation
    - Proof.Core.Leakage.Model
    - Proof.Core.Leakage.Simulator
    - Proof.Core.Leakage.Driver
    - Proof.Core.Leakage.Invariant
    - Proof.Core.Leakage.Obligation
    - Elf.ElfLoader
    - Elf.Syscall
    - HardwareSim
    - Core.Alu
    - Core.Instruction
    - Core.ISA
    - Core.Pipeline
    - Memory.Types
    - Memory.Ideal
    - Memory.Vec
    - Memory.ST
    - Memory.IO
    - Memory.Cache4K
    - Memory.Cache4KServer
    - Pretty
    - Core.RegFile
    - Simulate
    - Types
    - Util

executables:
  aimcore-exe:
    main:                Main.hs
    source-dirs:         app
    ghc-options:
    - -threaded
    - -rtsopts
    - -with-rtsopts=-N
    dependencies:
    - aimcore
    - optparse-applicative

tests:
  aimcore-test:
    main:                Spec.hs
    source-dirs:         test
    other-modules:
      - BenchmarkSpec
      - Cache4KSpec
      - CacheProofSpec
      - InstructionSpec
      - IsaSpec
      - ProofSpec
    when:
      - condition: flag(smt-proof)
        cpp-options: -DSMT_PROOF
    ghc-options:
    - -threaded
    - -rtsopts
    - -with-rtsopts=-N
    dependencies:
    - aimcore
    - melf
    - bytestring
    - exceptions
    - QuickCheck
