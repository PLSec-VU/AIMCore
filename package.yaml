name:                aimcore
version:             0.1.0.0
github:              "githubuser/aimcore"
license:             BSD-3-Clause
author:              "Author name here"
maintainer:          "example@example.com"
copyright:           "2024 Author name here"

extra-source-files:
- README.md
- CHANGELOG.md

# Metadata used when publishing your package
# synopsis:            Short description of your package
# category:            Web

# To avoid duplicated efforts in documentation and dealing with the
# complications of embedding Haddock markup inside cabal files, it is
# common to point users to the README.md file.
description:         Please see the README on GitHub at <https://github.com/githubuser/aimcore#readme>

# The modules under proof-smt/ discharge their properties through an SMT solver
# while GHC compiles them, so building them needs a solver on PATH and takes as
# long as the solver does. Pantomime goes through SBV, and SBV's Z3 backend is
# pointed at a different binary with SBV_Z3; Z3 itself does not finish these in
# useful time, while bitwuzla takes seconds each:
#
#   SBV_Z3=/usr/local/bin/bitwuzla SBV_Z3_OPTIONS="--produce-models" stack test
#
# Do not add --fast: at -O0 GHC creates no unfoldings and the plugin fails with
# "Unbound variable in symbolise" rather than reporting a failed proof.
#
# Turn the flag off to build and test everything else without a solver, which is
# what CI does:
#
#   stack test --flag aimcore:-smt-proof
flags:
  smt-proof:
    description: Discharge the symbolic proof obligations at compile time.
    manual: true
    default: true

default-extensions:
- BinaryLiterals
- DataKinds
- ExplicitNamespaces
- FlexibleContexts
- FlexibleInstances
- LambdaCase
- NumericUnderscores
- OverloadedStrings
- ScopedTypeVariables
- TemplateHaskell
- TypeApplications
- TypeOperators
- DeriveAnyClass
- DeriveGeneric
- MultiParamTypeClasses
- AllowAmbiguousTypes
- PackageImports
- RecordWildCards
- GeneralizedNewtypeDeriving
- DerivingStrategies

dependencies:
- base >= 4.7 && < 5
- clash-prelude >= 1.8.1
- composition
- mtl >= 2.2.2
- transformers
- pretty
- tasty
- tasty-hunit
- tasty-quickcheck
- containers
- ghc-typelits-natnormalise
- array
- melf
- bytestring
- exceptions
- entropy
- binary
- pantomime
- pantomime-clash
- pantomime-base
- template-haskell

ghc-options:
- -Wall
- -Wcompat
- -Widentities
- -Wincomplete-record-updates
- -Wincomplete-uni-patterns
- -Wmissing-export-lists
- -Wmissing-home-modules
- -Wpartial-fields
- -Wredundant-constraints
- -fexpose-all-unfoldings
- -fplugin GHC.TypeLits.Normalise
- -fplugin Pantomime

library:
  source-dirs:
    - src
    - proof
  when:
    - condition: flag(smt-proof)
      source-dirs: proof-smt
      exposed-modules:
        - Proof.Functional.Induction
        - Proof.SMT.Sanity
      cpp-options: -DSMT_PROOF
  exposed-modules:
    - Proof.Machine
    - Proof.Driver
    - Proof.Functional.Invariant
    - Proof.Functional.Obligation
    - Proof.Leakage.Model
    - Proof.Leakage.Simulator
    - Proof.Leakage.Obligation
    # Proof.Leakage.Induction: temporarily out of the build. Its four properties
    # are invalid since the aliasing-store assumption was dropped, and the
    # counterexample-extraction path trips a Pantomime/effectful unlifting bug
    # ("version (2356) /= storageVersion (0)") that fails the build outright.
    # Restore once the leakage model can express the store-hazard stall.
    - Proof.SMT.Array
    - Proof.SMT.Axioms
    - Proof.SMT.Logged
    - Access
    - Core
    - Elf.ElfLoader
    - Elf.Syscall
    - HardwareSim
    - Instruction
    - Interp
    - ISA
    - Memory.Types
    - Memory.Vec
    - Memory.ST
    - Memory.IO
    - Leak.Arch.Arch
    - Leak.PC.ISA
    - Leak.PC.Leak
    - Leak.PC.PC
    - Leak.PC.Sim
    - Leak.PCWithState.PCWithState
    - Leak.SecretPC.Leak
    - Leak.SecretPC.PC
    - Leak.MonitorPC.MonitorLeak
    - Leak.MonitorPC.PC
    - Leak.MonitorPC.Sim
    - Leak.Existence
    - Pretty
    - RegFile
    - Simulate
    - Types
    - Util

executables:
  aimcore-exe:
    main:                Main.hs
    source-dirs:         app
    ghc-options:
    - -threaded
    - -rtsopts
    - -with-rtsopts=-N
    dependencies:
    - aimcore
    - optparse-applicative
    - binary
    - blake2

tests:
  aimcore-test:
    main:                Spec.hs
    source-dirs:         test
    when:
      - condition: flag(smt-proof)
        cpp-options: -DSMT_PROOF
    ghc-options:
    - -threaded
    - -rtsopts
    - -with-rtsopts=-N
    dependencies:
    - aimcore
    - melf
    - bytestring
    - exceptions
    - QuickCheck
