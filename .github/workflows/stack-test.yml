name: Stack Test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Haskell
      uses: haskell-actions/setup@v2
      with:
        enable-stack: true
        stack-version: 'latest'


    - name: Cache Stack
      uses: actions/cache@v4
      with:
        path: |
          ~/.stack
          .stack-work
        key: ${{ runner.os }}-stack-${{ hashFiles('stack.yaml', 'package.yaml') }}
        restore-keys: |
          ${{ runner.os }}-stack-

    - name: Install dependencies with Stack
      run: stack test --only-dependencies --no-nix --flag aimcore:-smt-proof

    # The proof obligations under proof-smt/ are discharged by an SMT solver
    # while GHC compiles them. Z3 -- the only solver packaged for Ubuntu -- does
    # not finish them in useful time, so CI builds without them and they are
    # checked locally against bitwuzla instead. Everything else, including the
    # QuickCheck harness for the same obligations and the rv32ui conformance
    # suites, still runs here.
    - name: Build and run tests
      run: stack test --no-nix --flag aimcore:-smt-proof
