name: Stack Test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Haskell
      uses: haskell-actions/setup@v2
      with:
        enable-stack: true
        stack-version: 'latest'

    - name: Install Z3
      run: |
        Z3_VERSION="5.1.0"
        Z3_DIR="z3-${Z3_VERSION}-x64-glibc-2.39"
        curl -sL "https://github.com/Z3Prover/z3/releases/download/z3-${Z3_VERSION}/${Z3_DIR}.zip" -o /tmp/z3.zip
        unzip -q /tmp/z3.zip -d /tmp
        sudo install -m 755 "/tmp/${Z3_DIR}/bin/z3" /usr/local/bin/z3
        rm -rf "/tmp/${Z3_DIR}" /tmp/z3.zip
        z3 --version

    - name: Cache Stack
      uses: actions/cache@v4
      with:
        path: |
          ~/.stack
          .stack-work
        key: ${{ runner.os }}-stack-${{ hashFiles('stack.yaml', 'package.yaml') }}
        restore-keys: |
          ${{ runner.os }}-stack-

    - name: Install dependencies with Stack
      run: stack test --only-dependencies --no-nix

    - name: Build and run tests
      run: stack test --no-nix
